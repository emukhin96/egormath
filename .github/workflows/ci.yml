name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check canvas autosave
        run: node --test tools/test_canvas.js

      # app.css не в git: собираем его до тестов (тест collectstatic ждёт файл)
      - name: Build CSS
        run: make build-css

      - name: Run tests
        working-directory: public_html
        run: python manage.py test
