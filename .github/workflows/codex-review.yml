name: Codex PR review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: codex-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze pull request
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      final_message: ${{ steps.codex.outputs.final-message }}

    steps:
      - name: Check out pull request merge commit
        uses: actions/checkout@v5
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 0
          persist-credentials: false

      - name: Run read-only Codex review
        id: codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .github/codex/prompts/review.md
          output-file: codex-review.json
          output-schema-file: .github/codex/review-schema.json
          sandbox: read-only
          safety-strategy: drop-sudo
          codex-args: '["--ephemeral"]'

  publish:
    name: Publish review comments
    needs: analyze
    if: >-
      needs.analyze.result == 'success' &&
      needs.analyze.outputs.final_message != ''
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write

    steps:
      - name: Publish summary and inline comments
        uses: actions/github-script@v7
        env:
          CODEX_FINAL_MESSAGE: ${{ needs.analyze.outputs.final_message }}
        with:
          github-token: ${{ github.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = context.payload.pull_request.number;
            const headSha = context.payload.pull_request.head.sha;
            const summaryMarker = '<!-- codex-automated-review -->';

            function parseResult(value) {
              let raw = String(value || '').trim();
              raw = raw.replace(/^```(?:json)?\s*/i, '').replace(/\s*```$/, '');

              const parsed = JSON.parse(raw);
              if (
                !parsed ||
                typeof parsed !== 'object' ||
                Array.isArray(parsed) ||
                typeof parsed.summary !== 'string' ||
                !Array.isArray(parsed.findings)
              ) {
                throw new Error('output does not match the expected top-level shape');
              }
              return parsed;
            }

            function collectAddedLines(patch) {
              const result = new Set();
              let newLine = null;

              for (const row of String(patch || '').split('\n')) {
                const hunk = row.match(/^@@ -\d+(?:,\d+)? \+(\d+)(?:,\d+)? @@/);
                if (hunk) {
                  newLine = Number(hunk[1]);
                  continue;
                }
                if (newLine === null) continue;

                if (row.startsWith('+') && !row.startsWith('+++')) {
                  result.add(newLine);
                  newLine += 1;
                } else if (row.startsWith('-') && !row.startsWith('---')) {
                  // A deletion does not advance the right-side line number.
                } else if (!row.startsWith('\\')) {
                  newLine += 1;
                }
              }

              return result;
            }

            let review;
            try {
              review = parseResult(process.env.CODEX_FINAL_MESSAGE);
            } catch (error) {
              core.setFailed(`Codex returned invalid JSON: ${error.message}`);
              return;
            }

            const changedFiles = await github.paginate(
              github.rest.pulls.listFiles,
              { owner, repo, pull_number, per_page: 100 }
            );

            const validLocations = new Map();
            for (const file of changedFiles) {
              validLocations.set(file.filename, collectAddedLines(file.patch));
            }

            const previousInlineComments = await github.paginate(
              github.rest.pulls.listReviewComments,
              { owner, repo, pull_number, per_page: 100 }
            );

            const allowedPriorities = new Set(['P0', 'P1', 'P2', 'P3']);
            const seenInThisRun = new Set();
            const inlineComments = [];
            const summaryOnly = [];
            let publishedInlineCount = 0;

            for (const rawFinding of review.findings.slice(0, 25)) {
              const priority = String(rawFinding?.priority || '').trim();
              const path = String(rawFinding?.path || '').trim();
              const line = Number(rawFinding?.line);
              const body = String(rawFinding?.body || '').trim();

              if (
                !allowedPriorities.has(priority) ||
                !path ||
                !Number.isInteger(line) ||
                line < 1 ||
                !body
              ) {
                summaryOnly.push(
                  `[invalid finding] ${priority || '?'} ${path || '?'}:${line || '?'} — ${body || 'empty body'}`
                );
                continue;
              }

              const findingKey = `${priority}:${path}:${line}:${body}`;
              if (seenInThisRun.has(findingKey)) continue;
              seenInThisRun.add(findingKey);

              const signature =
                `<!-- codex-finding:${headSha}:${priority}:${encodeURIComponent(path)}:${line} -->`;

              if (
                previousInlineComments.some(comment =>
                  String(comment.body || '').includes(signature)
                )
              ) {
                continue;
              }

              const addedLines = validLocations.get(path);
              if (!addedLines || !addedLines.has(line)) {
                summaryOnly.push(`[${priority}] ${path}:${line} — ${body}`);
                continue;
              }

              inlineComments.push({
                path,
                line,
                side: 'RIGHT',
                body: `${signature}\n**[${priority}]** ${body}`,
              });
            }

            if (inlineComments.length > 0) {
              try {
                await github.rest.pulls.createReview({
                  owner,
                  repo,
                  pull_number,
                  commit_id: headSha,
                  event: 'COMMENT',
                  body: `Automated Codex review for ${headSha.slice(0, 7)}.`,
                  comments: inlineComments,
                });
                publishedInlineCount = inlineComments.length;
              } catch (error) {
                core.warning(`Inline review could not be published: ${error.message}`);
                for (const comment of inlineComments) {
                  const cleanBody = comment.body.replace(/^<!--.*?-->\n/, '');
                  summaryOnly.push(`[inline fallback] ${comment.path}:${comment.line} — ${cleanBody}`);
                }
              }
            }

            const summaryLines = [
              summaryMarker,
              '## Codex review',
              '',
              review.summary.trim(),
              '',
              `New inline comments published by this run: ${publishedInlineCount}.`,
            ];

            if (summaryOnly.length > 0) {
              summaryLines.push(
                '',
                '### Findings without an inline location',
                '',
                ...summaryOnly.map(item => `- ${item}`)
              );
            }

            summaryLines.push(
              '',
              '_Automated read-only review. No files, commits, branches, or merge state were changed._'
            );

            const summaryBody = summaryLines.join('\n');
            const issueComments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number: pull_number, per_page: 100 }
            );

            const previousSummary = issueComments.find(comment =>
              comment.user?.login === 'github-actions[bot]' &&
              String(comment.body || '').includes(summaryMarker)
            );

            if (previousSummary) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: previousSummary.id,
                body: summaryBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pull_number,
                body: summaryBody,
              });
            }
