{% if images %}
<div class="task-images">
  {% for img in images %}
  {% if img.is_pdf %}
  <object class="task-image-object" type="application/pdf"
          data="{% if img.url %}{{ img.url }}{% else %}{% url 'task_image_file' img.pk %}{% endif %}#toolbar=0&navpanes=0"
          aria-label="PDF-иллюстрация: {{ img.filename }}">
    <a class="task-image-pdf" href="{% if img.url %}{{ img.url }}{% else %}{% url 'task_image_file' img.pk %}{% endif %}"
       target="_blank" rel="noopener">PDF-иллюстрация: {{ img.filename }}</a>
  </object>
  {% else %}
  <img src="{% if img.url %}{{ img.url }}{% else %}{% url 'task_image_file' img.pk %}{% endif %}" alt="иллюстрация к задаче" loading="lazy">
  {% endif %}
  {% endfor %}
</div>
{% endif %}
