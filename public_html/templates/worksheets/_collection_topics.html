{% load task_extras %}{% if topics %}<div class="collection-topics">{% for topic in topics %}{% if not limit or forloop.counter <= limit %}<span class="collection-topic" title="{% if topic.code %}{{ topic.code }} · {% endif %}{{ topic.name }}">{{ topic.name }}</span>{% endif %}{% endfor %}{% if limit and topics|length > limit %}<span class="collection-topic-more">+{{ topics|length|sub:limit }}</span>{% endif %}</div>{% else %}<span class="muted">Тема не назначена</span>{% endif %}
