{% extends 'base.html' %}
{% block title %}.tex — {{ worksheet.title }} — EgorMath{% endblock %}
{% block content %}
<h1>.tex-исходник: {{ worksheet.title }} <span class="muted">({{ variant }})</span></h1>
<p>
  <a class="btn btn-small btn-secondary" href="{% url 'worksheet_tex' worksheet.pk %}?variant=student">ученик</a>
  <a class="btn btn-small btn-secondary" href="{% url 'worksheet_tex' worksheet.pk %}?variant=answers">с ответами</a>
  <a class="btn btn-small btn-secondary" href="{% url 'worksheet_tex' worksheet.pk %}?variant=teacher">учитель</a>
  <a class="btn btn-small" href="{% url 'worksheet_detail' worksheet.pk %}">К листку</a>
</p>
<pre class="log">{{ tex }}</pre>
{% endblock %}
