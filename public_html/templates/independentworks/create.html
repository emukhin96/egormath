{% extends 'independentworks/base.html' %}{% block content %}<h1>Новая самостоятельная</h1><p>Создайте пустой шаблон или выберите исходный листок / подборку. Для подборки добавятся известные аналоги номеров.</p><form method="post" class="card iw-section">{% csrf_token %}{{ form.as_p }}<label>Из своего листка<select name="worksheet"><option value="">С нуля</option>{% for sheet in worksheets %}<option value="{{ sheet.pk }}">{{ sheet.title }}</option>{% endfor %}</select></label><label>Из подборки (приоритет перед листком)<select name="collection"><option value="">Не выбрана</option>{% for collection in collections %}<option value="{{ collection.pk }}">{{ collection.worksheet.title }}</option>{% endfor %}</select></label><div class="form-buttons"><button class="btn">Создать черновик</button></div></form>{% endblock %}
