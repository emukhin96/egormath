{% extends 'base.html' %}
{% block title %}Восстановление пароля — Математика{% endblock %}
{% block content %}
<div class="card login-box">
  <h1>Восстановление пароля</h1>
  <p class="muted">Укажите почту из своего профиля. Пришлём письмо со ссылкой, по которой можно задать новый пароль.</p>
  <form method="post">
    {% csrf_token %}
    <p>
      <label for="id_email">Почта</label>
      {{ form.email.errors }}
      <input type="email" name="email" id="id_email" value="{{ form.email.value|default:'' }}" autofocus required autocomplete="email" maxlength="254">
    </p>
    <p class="form-buttons">
      <button type="submit" class="btn">Отправить письмо</button>
      <a class="btn btn-secondary" href="{% url 'login' %}">Войти</a>
    </p>
  </form>
</div>
{% endblock %}
