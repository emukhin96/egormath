{% load task_extras %}
{# Номер — отдельная колонка; продолжение условия идёт под звёздами, но не под номером. #}
<div class="task-row">
  <span class="ws-num">{{ number }}.</span>
  <span class="task-copy">
    {% if stars %}<span class="stars">{% for _ in ''|center:stars %}★{% endfor %}</span>{% endif %}
    <span class="math-content task-text">{{ text|web_text }}</span>
  </span>
</div>
