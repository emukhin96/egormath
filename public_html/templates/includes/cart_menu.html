{# Корзина задач в шапке: счётчик, список отобранного и две развязки — листок или самостоятельная. Данные — из accounts.context_processors.shell #}
<details class="cart-menu" id="cart-menu" data-cart-menu data-panel-url="{% url 'cart_panel' %}">
  <summary class="btn btn-secondary cart-summary" title="Отобранные задачи: собрать из них листок или самостоятельную">
    <svg class="cart-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v14H4z"/><path d="M4 10h16M9 10v9"/></svg>
    <span class="cart-label">Корзина</span>
    <span class="cart-count" data-cart-count {% if not cart.count %}hidden{% endif %}>{{ cart.count }}</span>
  </summary>
  {% include 'includes/cart_panel.html' %}
</details>
