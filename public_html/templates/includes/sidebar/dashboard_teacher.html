{# В панели только контекст: недавние листки. Счётчики и действия — в содержимом страницы #}
<section class="sidebar-section">
  <p class="sidebar-kicker">Недавние листки</p>
  {% if worksheets %}
  <ul class="sidebar-list">
    {% for worksheet in worksheets|slice:":6" %}
    <li><a href="{% url 'worksheet_detail' worksheet.pk %}">{{ worksheet.title|truncatechars:32 }}</a></li>
    {% endfor %}
  </ul>
  {% else %}
  <p class="sidebar-copy">Листков пока нет.</p>
  {% endif %}
</section>
