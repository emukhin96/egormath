{# В панели только навигация по рубрикатору: фильтры и их сброс — в строке над таблицей, действия — в шапке страницы #}
<section class="sidebar-section">
  <p class="sidebar-kicker">Рубрикатор</p>
  <ul class="sidebar-list">
    {% for topic in topics %}
    <li><a href="?topic={{ topic.pk }}">{{ topic.name }}</a></li>
    {% empty %}
    <li>Темы ещё не добавлены</li>
    {% endfor %}
  </ul>
</section>
