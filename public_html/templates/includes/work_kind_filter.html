<form method="get" class="card filter-card">
  <div class="filters">
    <div>
      <select name="kind" id="work-kind" aria-label="Вид работы">
        <option value="">Все работы</option>
        <option value="ordinary"{% if kind == 'ordinary' %} selected{% endif %}>Обычные задания</option>
        <option value="independent"{% if kind == 'independent' %} selected{% endif %}>Самостоятельные</option>
      </select>
    </div>
    <div class="filter-actions"><button class="btn btn-secondary">Применить</button></div>
  </div>
</form>
