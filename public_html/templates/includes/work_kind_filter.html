{% load page_tools %}
{# Вид работы в кабинете ученика: сегменты-ссылки ?kind=, без кнопки «Применить» #}
<div class="page-toolbar">
  <nav class="seg" aria-label="Вид работы">
    <a class="seg-item{% if not kind %} is-active{% endif %}" href="{% query_set kind=None %}"{% if not kind %} aria-current="true"{% endif %}>Все работы</a>
    <a class="seg-item{% if kind == 'ordinary' %} is-active{% endif %}" href="{% query_set kind='ordinary' %}"{% if kind == 'ordinary' %} aria-current="true"{% endif %}>Задания</a>
    <a class="seg-item{% if kind == 'independent' %} is-active{% endif %}" href="{% query_set kind='independent' %}"{% if kind == 'independent' %} aria-current="true"{% endif %}>Самостоятельные</a>
  </nav>
</div>
