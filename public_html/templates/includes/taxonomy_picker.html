{# Параметры: mode, primary, facets, grades, compact, single, chip_full, field_name, selected_json, placeholder. #}
<div class="tax-picker{% if compact %} tax-picker-compact{% endif %}"
     data-tax-picker
     data-mode="{{ mode|default:'assign' }}"
     data-primary="{{ primary|yesno:'1,0' }}"
     data-facets="{{ facets|yesno:'1,0' }}"
     data-grades="{{ grades|yesno:'1,0' }}"
     data-compact="{{ compact|yesno:'1,0' }}"
     data-single="{{ single|yesno:'1,0' }}"
     data-chip-full="{{ chip_full|yesno:'1,0' }}"
     data-topic-field="{{ field_name|default:'' }}"
     data-state="{{ selected_json }}">
  <div class="tax-chips" data-tax-chips></div>
  {% if grades %}
  <div class="tax-grades" data-tax-grades></div>
  {% endif %}
  <div class="tax-search-row">
    <input type="search" class="tax-search" data-tax-search
           placeholder="{% if placeholder %}{{ placeholder }}{% elif compact %}Тема: код или название{% else %}Код или название темы{% endif %}"{% if placeholder %} aria-label="Добавить тему в фильтр"{% endif %}
           autocomplete="off">
  </div>
  <div class="tax-panel" data-tax-panel {% if compact %}hidden{% endif %}>
    <div class="tax-tree" data-tax-tree></div>
    {% if facets %}
    <div class="tax-extra" data-tax-extra>
      <button type="button" class="tax-more" data-tax-more>Ещё метки</button>
      <div class="tax-facets" data-tax-facets hidden></div>
    </div>
    {% endif %}
  </div>
</div>
