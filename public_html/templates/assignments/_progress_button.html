<button type="button" class="progress-mark progress-{{ cell.status }}" data-attempt-url="{% if cell.detail_url %}{{ cell.detail_url }}{% else %}{% url 'task_attempts' person.assignment.pk cell.task.pk %}?item={{ cell.item.pk }}{% if cell.is_part %}&amp;subitem={{ cell.owner.pk }}{% endif %}{% endif %}" aria-label="{{ cell.label }}: {{ cell.status_label }}{% if not cell.detail_url %} — {{ cell.attempt_count }} попыток{% endif %}" title="{{ cell.label }}: {{ cell.status_label }}{% if not cell.detail_url %} · {{ cell.attempt_count }} попыток{% endif %}{% if cell.current_changed %} · Текущий ввод изменён после проверки{% endif %}{% if cell.review.grade %} · Оценка {{ cell.review.grade_symbol }} за всю задачу{% endif %}">{% if cell.mark %}{{ cell.mark }}{% elif cell.status == 'ok' %}✓{% if cell.attempt_count > 1 %}<sub>{{ cell.attempt_count }}</sub>{% endif %}{% elif cell.status == 'wrong' %}×{% if not cell.detail_url %}<sub>{{ cell.attempt_count }}</sub>{% endif %}{% elif cell.status == 'empty' %}—{% elif cell.status == 'unknown' %}?{% else %}…{% endif %}</button>
