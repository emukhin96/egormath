<div class="grade-scale" data-grade-url="{% url 'grade_task' assignment.pk row.task.pk %}" aria-label="Оценка задачи {{ row.number }}">
{% for value,label in grade_choices %}<button type="button" class="btn btn-small btn-secondary" data-grade="{{ value }}" aria-label="{{ value }} — {{ label }}" title="{{ label }}" aria-pressed="{% if row.review.grade == value %}true{% else %}false{% endif %}">{{ value }}</button>{% endfor %}
</div>
