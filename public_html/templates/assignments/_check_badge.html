{# Бейдж автосверки: status — '', ok, wrong, unknown; prefix — имя поля для live-обновления (assignment.js) #}
<span class="check-badge" data-check="{{ prefix }}" data-status="{{ status }}">{% if status == 'ok' %}<span class="badge badge-reviewed" title="Совпало с эталоном">✓ совпало</span>{% elif status == 'wrong' %}<span class="badge badge-returned" title="Не совпало с эталоном — проверьте запись">✗ не совпало</span>{% elif status == 'unknown' %}<span class="badge badge-assigned" title="Автосверка не смогла разобрать ответ; учитель проверит вручную">? не разобрано</span>{% endif %}</span>
