{# Бейдж автосверки: status — '', ok, wrong, unknown; prefix — имя поля для обновления по кнопке «Проверить» (assignment.js) #}
<span class="check-badge" data-check="{{ prefix }}" data-status="{{ status }}">{% if status == 'ok' %}<span class="badge badge-reviewed" title="Ответ совпал с эталоном">✓ верно</span>{% elif status == 'wrong' %}<span class="badge badge-returned" title="Ответ не совпал с эталоном — проверьте запись">✗ неверно</span>{% elif status == 'unknown' %}<span class="badge badge-assigned" title="Автосверка не смогла разобрать ответ; учитель проверит вручную">? не разобрано</span>{% endif %}</span>
